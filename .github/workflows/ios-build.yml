# ios-build.yml — Phase 0a：证明 Beminder 工程可复现生成、可 build
#
# 验收标准（Phase 0）：source + project.yml → xcodegen generate → xcodebuild
# → iOS target build succeeds。本工作流只跑**模拟器** build，**不签名、不归档、
# 不输出 IPA**——那是 Phase 1（device install / 真机验证）的事。
#
# 本副本面向独立仓库拓扑（已用 subtree push 抽出的 Yijun-Linda/beminder），
# ios/ 位于仓库根，PROJECT_DIR="ios"、paths 过滤按仓库根解析为 ios/**（M3）。

name: ios-build-simulator

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'

env:
  PROJECT_DIR: "ios"

jobs:
  generate-and-build:
    name: XcodeGen + simulator build
    runs-on: macos-latest
    steps:
      - name: Checkout
        # L14：按 commit SHA 固定第三方 action，避免 v4 标签被上游移动引入投毒。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodegen generate
          ls -la Beminder.xcodeproj

      - name: Build for iOS Simulator (no signing)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild -project Beminder.xcodeproj \
                     -scheme Beminder \
                     -configuration Debug \
                     -destination 'generic/platform=iOS Simulator' \
                     -derivedDataPath build/DerivedData \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Upload derived data (debug)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: derived-data
          path: ${{ env.PROJECT_DIR }}/build/DerivedData
          if-no-files-found: ignore
          retention-days: 3