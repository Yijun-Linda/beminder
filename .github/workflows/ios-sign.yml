# ios-sign.yml — Phase 1：签名 + 出 IPA（真机安装）
#
# 目的：在云端 macOS 运行器上完成「无 Mac 也能出可装到 iPhone 的 IPA」。
# 流程：XcodeGen 生成工程 → 从 GitHub Secrets 恢复 p12 证书 + mobileprovision
#       → 建 keychain 导入证书 → archive（手动签名）→ exportArchive 出 IPA → 上传 artifact。
#
# 前提（免费开发者档，Apple Developer Free Provisioning）：
#   - 证书：Apple Development 证书私钥（p12），由用户在自己机器上从 Xcode 导出。
#   - 描述文件：免费档描述文件为「iOS Team Provisioning Profile: com.yijun.beminder」，
#     有效期仅 7 天，须定期刷新并更新 Secret（见 docs/dev/ios-signing-secrets.md）。
#   - 本 workflow 手动签名、不调用 -allowProvisioningUpdates（免费档无 Apple 凭据，
#     不会尝试登录账号，避免 CI 卡在账号鉴权）。
#
# 放置说明：与 ios-build.yml 相同。若在根仓库（mono-repo）拓扑下跑 CI，把本文件
# 放到根仓库 .github/workflows/ 并把 PROJECT_DIR 改为 "vibe-muse/beminder/ios"；
# 若已用 subtree push 抽成独立仓库（beminder/.github/workflows 位于仓库根），
# 保持默认 PROJECT_DIR="ios" 即可。
#
# 使用前必须先配置 4 个 GitHub Secrets（见 docs/dev/ios-signing-secrets.md）：
#   BEMINDER_TEAM_ID           开发者 Team ID（本机 Xcode 账号 <TEAM_ID>）
#   BEMINDER_CERT_P12_B64      cert.p12 的 base64（不含换行）
#   BEMINDER_CERT_P12_PASSWORD p12 导出时设置的密码
#   BEMINDER_PROVISIONING_B64  *.mobileprovision 的 base64（不含换行）

name: ios-sign-ipa

on:
  workflow_dispatch:    # 手动触发；免费档 profile 7 天一轮，按需手动跑

env:
  PROJECT_DIR: "ios"   # 见上方放置说明；mono-repo 拓扑改为 "vibe-muse/beminder/ios"
  TEAM_ID: ${{ secrets.BEMINDER_TEAM_ID }}
  BUNDLE_ID: "com.yijun.beminder"
  SCHEME: "Beminder"

jobs:
  sign-and-export:
    name: Archive + export IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodegen generate
          ls -la Beminder.xcodeproj

      - name: Restore signing assets from secrets
        env:
          P12_B64: ${{ secrets.BEMINDER_CERT_P12_B64 }}
          P12_PASSWORD: ${{ secrets.BEMINDER_CERT_P12_PASSWORD }}
          PROV_B64: ${{ secrets.BEMINDER_PROVISIONING_B64 }}
        run: |
          set -euxo pipefail
          # 1) 恢复 p12 证书
          echo "$P12_B64" | base64 --decode > /tmp/cert.p12
          # 2) 恢复描述文件并提取 UUID（用于指定签名 profile）
          echo "$PROV_B64" | base64 --decode > /tmp/beminder.mobileprovision
          security cms -D -i /tmp/beminder.mobileprovision > /tmp/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/beminder.mobileprovision \
             "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Create keychain and import certificate
        env:
          P12_PASSWORD: ${{ secrets.BEMINDER_CERT_P12_PASSWORD }}
        run: |
          set -euxo pipefail
          KEYCHAIN="$RUNNER_TEMP/beminder.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" \
                     -P "$P12_PASSWORD" \
                     -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"

      - name: Archive (manual signing)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          PROFILE_UUID: ${{ env.PROFILE_UUID }}
        run: |
          xcodebuild -project Beminder.xcodeproj \
                     -scheme ${{ env.SCHEME }} \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/Beminder.xcarchive \
                     CODE_SIGN_STYLE=Manual \
                     DEVELOPMENT_TEAM=${{ env.TEAM_ID }} \
                     PROVISIONING_PROFILE=${{ env.PROFILE_UUID }} \
                     CODE_SIGN_IDENTITY="Apple Development" \
                     archive

      - name: Generate exportOptions.plist
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          PROFILE_UUID: ${{ env.PROFILE_UUID }}
        run: |
          cat > build/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ env.TEAM_ID }}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ env.BUNDLE_ID }}</key>
                  <string>${{ env.PROFILE_UUID }}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild -exportArchive \
                     -archivePath build/Beminder.xcarchive \
                     -exportOptionsPlist build/exportOptions.plist \
                     -exportPath build/export
          ls -la build/export/

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Beminder-ipa
          path: ${{ env.PROJECT_DIR }}/build/export/*.ipa
          if-no-files-found: error
          retention-days: 7
